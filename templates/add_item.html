<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adicionar Item</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    <h2>Adicionar item</h2>

    <form action="/add_item" method="post">

        <input
            id="name"
            name="name"
            placeholder="Nome do item"
        >

        <input
            id="barcode"
            name="barcode"
            placeholder="Código de barras"
            readonly
        >

        <input
            id="price"
            name="price"
            placeholder="Preço"
            type="number"
            step="0.01"
        >

        <input
            id="quantity"
            name="quantity"
            placeholder="Quantidade"
            type="number"
        >

        <button type="submit">
            Inserir item
        </button>

    </form>

    <br>

    <button type="button" onclick="startScanner()">
        Ler código de barras
    </button>

    <br><br>

    <!-- Área da câmera -->
    <video
        id="video"
        width="400"
        height="300"
        autoplay
        playsinline
        style="display: none; border: 1px solid #ccc;"
    ></video>

    <!-- Canvas oculto usado para capturar frames -->
    <canvas
        id="canvas"
        width="400"
        height="300"
        style="display: none;"
    ></canvas>

    <p id="status"></p>

    <br>

    <a href="/items">
        Ver lista
    </a>

</div>


<script>

let stream = null
let scannerInterval = null


function atualizarStatus(texto) {
    document.getElementById("status").innerText = texto
}


function preencherFormulario(data) {

    document.getElementById("barcode").value = data.barcode || ""
    document.getElementById("name").value = data.name || ""
    document.getElementById("price").value = data.price || ""
    document.getElementById("quantity").value = data.quantity || ""

    if (data.exists) {
        atualizarStatus("Produto encontrado e preenchido automaticamente.")
    } else {
        atualizarStatus("Código encontrado. Produto novo, preencha os dados.")
    }
}


async function enviarFrame() {

    const video = document.getElementById("video")
    const canvas = document.getElementById("canvas")
    const context = canvas.getContext("2d")

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    )

    canvas.toBlob(async function(blob) {

        if (!blob) return

        const formData = new FormData()
        formData.append("file", blob, "barcode.jpg")

        try {

            const response = await fetch("/decode-barcode", {
                method: "POST",
                body: formData
            })

            const data = await response.json()

            console.log(data)

            if (data.success) {

                preencherFormulario(data)
                stopScanner()

            } else {

                atualizarStatus("Procurando código de barras...")

            }

        } catch (error) {

            console.log("Erro ao enviar imagem:", error)
            atualizarStatus("Erro ao processar leitura.")

        }

    }, "image/jpeg", 0.95)
}


async function startScanner() {

    const video = document.getElementById("video")

    try {

        atualizarStatus("Abrindo câmera...")

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                }
            }
        })

        video.srcObject = stream
        video.style.display = "block"

        atualizarStatus("Aponte para o código de barras...")

        /*
        Captura automática a cada 1.5 segundos
        */
        scannerInterval = setInterval(() => {
            enviarFrame()
        }, 1500)

    } catch (error) {

        console.log(error)
        atualizarStatus("Erro ao acessar a câmera.")

    }
}


function stopScanner() {

    const video = document.getElementById("video")

    if (scannerInterval) {
        clearInterval(scannerInterval)
        scannerInterval = null
    }

    if (stream) {
        stream.getTracks().forEach(track => track.stop())
        stream = null
    }

    video.style.display = "none"

}


</script>

</body>
</html>
